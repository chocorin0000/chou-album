<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>超！アルバム</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="超！アルバム">
<meta name="theme-color" content="#3A3046">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root {
  --bar: #3A3046; --panel: #2C2436; --btn: #4A3F5A; --gold: #FFC94D; --ink: #2C2436; --desk: #E9E4DA; --card: #F7F3EC;
  --sa-t: env(safe-area-inset-top, 0px); --sa-b: env(safe-area-inset-bottom, 0px);
  --sa-l: env(safe-area-inset-left, 0px); --sa-r: env(safe-area-inset-right, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bar); }
html, body {
  margin: 0; height: 100%; overflow: hidden; background: var(--bar); color: #222;
  font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  overscroll-behavior: none; -webkit-text-size-adjust: 100%;
}
.screen {
  position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--bar);
  padding: calc(var(--sa-t) + 4px) var(--sa-r) var(--sa-b) var(--sa-l);
}
.screen[hidden] { display: none; }
html.full .screen { position: absolute; }
canvas { touch-action: none; display: block; }
button { font: inherit; touch-action: manipulation; white-space: pre-line; }
input, textarea { font: inherit; }

/* ボタン */
.btn {
  border: 0; border-radius: 8px; background: var(--btn); color: #fff; font-size: 15px;
  padding: 0 10px; margin: 0; line-height: 1.15; cursor: pointer; min-width: 0;
}
.btn:active { filter: brightness(1.25); }
.btn.on { background: var(--gold) !important; color: var(--ink) !important; font-weight: bold; }
.btn.gold { background: var(--gold); color: var(--ink); font-weight: bold; }
.btn.plain { background: none; }
.btn.frame { background: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.55); }
.btn.small { height: 36px; font-size: 14px; padding: 0 12px; background: #E6E0EE; color: #3A3046; margin: 4px 6px 0 0; }
.btn.wide { display: block; width: 100%; margin: 8px 0 0; height: 48px; font-size: 16px; background: #DDD6E6; color: #2C2436; }
.btn.wide.gold { background: var(--gold); }
.btn.mode { border-radius: 16px; color: var(--ink); font-weight: bold; padding: 0 12px; height: 36px; }

/* 上の帯 */
.head { display: flex; align-items: center; gap: 6px; padding: 6px 8px 6px 14px; min-height: 56px; flex: 0 0 auto; }
.head .title { flex: 1; color: #fff; font-size: 21px; font-weight: bold; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.head .title .cho { color: var(--gold); font-size: 30px; }
.head .btn { height: 44px; flex: 0 0 auto; }
.head .btn.add { padding: 0 16px; font-size: 16px; }
.head .menu { width: 40px; padding: 0; font-size: 22px; background: none; }
.foot { color: #C8C0D4; font-size: 13px; padding: 6px 14px; white-space: pre-line; flex: 0 0 auto; min-height: 30px; }
.foot:empty { display: none; }

/* 一覧（アルバム・ページ） */
.box { flex: 1; overflow-y: auto; background: var(--desk); padding: 12px; -webkit-overflow-scrolling: touch; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.card { background: var(--card); border-radius: 12px; padding: 8px; position: relative; cursor: pointer; }
.card .pic { position: relative; width: 100%; padding-top: 110%; height: 0; background: #fff; overflow: hidden; border-radius: 4px; }
.card .pic img { position: absolute; left: 4px; top: 4px; width: calc(100% - 8px); height: calc(100% - 8px); object-fit: contain; display: block; }
.card .pic.empty::after { content: attr(data-msg); position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.card .pic.empty { background: #EEE8DD; color: #8A8090; font-size: 13px; }
.card .name { font-size: 17px; font-weight: bold; color: #2C2436; margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 30px; }
.card .sub { font-size: 13px; color: #6A6070; }
.card .more { position: absolute; right: 2px; bottom: 6px; width: 40px; height: 40px; border: 0; background: none; font-size: 22px; color: #6A6070; }
.empty-msg { white-space: pre-line; font-size: 16px; color: #403848; padding: 20px 8px; line-height: 1.6; }

/* 編集の画面 */
#scr-edit .row { display: flex; flex: 1; min-height: 0; }
#ed-mid { position: relative; flex: 1; min-width: 0; min-height: 0; }
#page-cv { position: absolute; inset: 0; width: 100%; height: 100%; }
#selbar { position: absolute; left: 0; right: 0; top: 0; display: flex; gap: 6px; padding: 6px; overflow-x: auto; justify-content: safe center; pointer-events: none; }
#selbar > * { pointer-events: auto; flex: 0 0 auto; }
#selbar .btn { height: 38px; border-radius: 19px; background: rgba(44,36,54,0.93); font-size: 14px; }
#selbar .btn.del { background: rgba(192,57,43,0.95); }
#selbar .count { color: #fff; background: rgba(44,36,54,0.8); border-radius: 19px; padding: 10px 10px; font-size: 14px; }
#selbar:empty { display: none; }
.etop { display: flex; align-items: center; gap: 4px; padding: 3px 4px; flex: 0 0 auto; }
.etop .btn { height: 44px; background: none; padding: 0 6px; font-size: 14px; white-space: pre; flex: 0 0 auto; }
.etop .btn.mode { padding: 0 10px; height: 36px; }
.etop .btn.frame { height: 38px; font-size: 11px; padding: 0 6px; line-height: 1.1; }
.etop .sp { flex: 1; }
.btn.dim { opacity: 0.4; }
.epanel { background: var(--panel); flex: 0 0 auto; }
.tools { display: flex; gap: 4px; padding: 4px 4px 2px; }
.tools .btn { flex: 1; height: 46px; font-size: 15px; padding: 0; }
.colors { display: flex; align-items: center; gap: 2px; padding: 2px 6px 6px; }
.swatch { flex: 1; min-width: 0; height: 40px; border: 0; background: none; padding: 0; display: flex; align-items: center; justify-content: center; }
.swatch::after { content: ''; width: 28px; height: 28px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 1.5px #8A7F99; }
.swatch.on::after { box-shadow: 0 0 0 4px var(--gold); }
.colors .btn { height: 38px; font-size: 14px; padding: 0 8px; flex: 0 0 auto; }
.vpanel { display: flex; align-items: center; gap: 6px; padding: 6px 8px 8px 12px; background: var(--panel); flex: 0 0 auto; }
.vpanel .hint { flex: 1; color: #CFC6DD; font-size: 12px; white-space: pre-line; }
.vpanel .btn { height: 48px; }
.vpanel .btn.gold { padding: 0 18px; font-size: 16px; }

/* 横向き: 左の列に帯のボタン、右の列に道具と色 */
#scr-edit.land .eleft { display: flex; flex-direction: column; gap: 3px; width: 66px; padding: 4px 3px; flex: 0 0 auto; }
#scr-edit.land .eleft .btn { flex: 1; background: none; font-size: 13px; padding: 0 2px; white-space: pre-line; }
#scr-edit.land .eleft .btn.frame, #scr-edit.land .eleft .btn.mode { background-color: transparent; }
#scr-edit.land .eleft .btn.mode { flex: 0 0 auto; height: auto; padding: 8px 2px; }
#scr-edit.land .eright { width: 132px; display: flex; flex-direction: column; flex: 0 0 auto; background: var(--panel); padding: 4px 3px; }
#scr-edit.land .eright .tools { display: grid; grid-template-columns: 1fr 1fr; flex: 4.6; padding: 0; gap: 4px; }
#scr-edit.land .eright .tools .btn { height: auto; }
#scr-edit.land .eright .colors { display: grid; grid-template-columns: repeat(4, 1fr); flex: 2; padding: 4px 0; gap: 0; }
#scr-edit.land .eright .swatch { height: auto; }
#scr-edit.land .eright .wo { display: flex; gap: 4px; flex: 1.1; }
#scr-edit.land .eright .wo .btn { flex: 1; height: auto; padding: 0; }
#scr-edit.land .vright { width: 132px; display: flex; flex-direction: column; gap: 6px; background: var(--panel); padding: 8px 6px; flex: 0 0 auto; }
#scr-edit.land .vright .hint { flex: 1; color: #CFC6DD; font-size: 12px; white-space: pre-line; }
#scr-edit.land .vright .btn { height: 52px; }
#scr-edit.land .vright .btn.gold { height: 64px; font-size: 16px; }

/* 切り抜き */
#scr-crop { background: #1E1A24; }
#scr-crop .ctext { color: #fff; font-size: 15px; padding: 12px 14px 4px; flex: 0 0 auto; }
#crop-mid { position: relative; flex: 1; min-height: 0; }
#crop-cv { position: absolute; inset: 0; width: 100%; height: 100%; }
#scr-crop .ratios { display: flex; gap: 4px; padding: 4px; flex: 0 0 auto; }
#scr-crop .ratios .btn { flex: 1; height: 42px; font-size: 13px; padding: 0; }
#scr-crop .cbtns { display: flex; gap: 6px; padding: 4px 8px 10px; flex: 0 0 auto; }
#scr-crop .cbtns .btn { flex: 1; height: 50px; font-size: 16px; }
#scr-crop .cbtns .btn.gold { flex: 2; }
#scr-crop.land { flex-direction: row; }
#scr-crop.land .side { width: 180px; display: flex; flex-direction: column; padding: 6px; flex: 0 0 auto; }
#scr-crop.land .ctext { font-size: 13px; padding: 4px 4px 6px; }
#scr-crop.land .ratios { display: grid; grid-template-columns: 1fr 1fr; flex: 3; padding: 0; }
#scr-crop.land .ratios .btn { height: auto; }
#scr-crop.land .cbtns { flex-direction: column; flex: 2.4; padding: 8px 0 0; }
#scr-crop.land .cbtns .btn { height: auto; }

/* 設定 */
#set-box { flex: 1; overflow-y: auto; background: var(--desk); padding: 6px 16px 40px; -webkit-overflow-scrolling: touch; }
.section { background: var(--bar); color: #fff; font-size: 16px; font-weight: bold; padding: 6px 10px; margin-top: 16px; }
.note { font-size: 14px; color: #403848; padding: 6px 0 4px; white-space: pre-line; line-height: 1.5; }
.label { font-size: 14px; font-weight: bold; color: var(--bar); padding: 14px 0 2px; }
.input { display: block; width: 100%; font-size: 17px; padding: 8px; border: 1px solid #aab; border-radius: 6px; background: #fff; user-select: text; -webkit-user-select: text; }
.field { min-height: 42px; word-break: break-all; color: #222; cursor: pointer; display: block; width: 100%; font-size: 16px; padding: 9px 8px; border: 1px solid #aab; border-radius: 6px; background: #fff; text-align: left; }
.field.empty { color: #889; }
.check { display: flex; align-items: center; gap: 8px; font-size: 15px; padding: 10px 0 0; }
.check input { width: 22px; height: 22px; flex: 0 0 auto; }
.result { font-size: 15px; color: #203040; padding: 10px 0; white-space: pre-line; user-select: text; -webkit-user-select: text; }
.result:empty { display: none; }
.ver { color: #889; font-size: 12px; padding-top: 24px; white-space: pre-line; }

/* 箱 */
.dlg-back { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
.dlg { background: #fff; border-radius: 14px; width: 100%; max-width: 460px; max-height: 88%; display: flex; flex-direction: column; overflow: hidden; }
.dlg-title { font-size: 18px; font-weight: bold; padding: 18px 20px 6px; }
.dlg-msg { font-size: 15px; padding: 6px 20px; white-space: pre-line; color: #333; line-height: 1.5; }
.dlg-body { overflow-y: auto; padding: 4px 18px; }
.dlg-items { display: flex; flex-direction: column; padding: 4px 0; overflow-y: auto; }
.dlg-item { border: 0; background: none; text-align: left; font-size: 16px; padding: 14px 20px; border-top: 1px solid #eee; color: #222; }
.dlg-item:active { background: #eef; }
.dlg-btns { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 4px; padding: 8px 12px 12px; }
.dlg-btn { border: 0; background: none; color: #1E6FD9; font-size: 16px; padding: 10px 14px; }
.dlg-btn.strong { font-weight: bold; }
.ask textarea { resize: none; font-size: 18px; }
.quick { display: flex; flex-wrap: wrap; }
.papers { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.paper { border: 0; background: none; display: flex; flex-direction: column; align-items: center; font-size: 12px; padding: 6px 0; color: #333; }
.paper i { width: 44px; height: 44px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 1px #888; margin-bottom: 4px; }
.paper.on i { box-shadow: 0 0 0 4px #FFA000; }
.busy { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; }
.busy div { background: rgba(40,34,48,0.95); color: #fff; padding: 16px 22px; border-radius: 14px; font-size: 15px; max-width: 80%; text-align: center; white-space: pre-line; }

#toast {
  position: fixed; left: 50%; bottom: calc(120px + var(--sa-b)); transform: translateX(-50%); z-index: 40;
  max-width: 88%; background: rgba(60,60,60,0.93); color: #fff; font-size: 15px; padding: 12px 18px; border-radius: 22px;
  opacity: 0; pointer-events: none; transition: opacity .25s; text-align: center;
}
#toast.show { opacity: 1; }
.hidden-file { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
</style>
</head>
<body>
<div id="scr-list" class="screen"></div>
<div id="scr-album" class="screen" hidden></div>
<div id="scr-edit" class="screen" hidden></div>
<div id="scr-crop" class="screen" hidden></div>
<div id="scr-set" class="screen" hidden></div>
<input id="pick" class="hidden-file" type="file" accept="image/*" multiple>
<input id="cam" class="hidden-file" type="file" accept="image/*" capture="environment">
<input id="zipin" class="hidden-file" type="file" accept=".zip,application/zip,application/x-zip-compressed,*/*">
<script type="module" src="js/app.js"></script>
</body>
</html>
